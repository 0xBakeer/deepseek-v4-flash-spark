# Build the container on GitHub's arm64 runners and publish it to GHCR.
# Runs on every version tag (v0.1.0 → :0.1.0 and :latest) and on demand.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The engine compile needs room: the CUDA devel base alone is ~9 GB unpacked.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version from tag
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=$(cat VERSION)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            RECIPE_VERSION=${{ steps.v.outputs.version }}
            MAX_JOBS=4
          tags: |
            ghcr.io/0xbakeer/deepseek-v4-flash-spark:${{ steps.v.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && 'ghcr.io/0xbakeer/deepseek-v4-flash-spark:latest' || '' }}
